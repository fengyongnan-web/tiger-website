</head>
<body>
    <div id="canvas-container"></div>

    <nav class="navbar">
        <div class="brand">TIGER</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="products.html">产品中心</a></li>

            <li><a href="about.html">关于我们</a></li>
            <li><a href="contact.html" class="active">联系我们</a></li>
        </ul>
    </nav>

    <div class="page-content">
        <h2 class="section-title">联系我们</h2>
        <div class="contact-grid">
            <div class="contact-info">
                <h3>联系方式</h3>
                <div class="info-item">
                    <div class="info-label">电话 / TEL</div>
                    <div class="info-value">+86 000 0000 0000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">邮箱 / EMAIL</div>
                    <div class="info-value">info@tiger-trade.com</div>
                </div>
                <div class="info-item">
                    <div class="info-label">WhatsApp</div>
                    <div class="info-value">+86 000 0000 0000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">地址 / ADDRESS</div>
                    <div class="info-value">中国 · 江苏省 · 常州市</div>
                </div>
            </div>

            <div class="contact-form">
                <h3>发送询盘</h3>
                <form action="https://formspree.io/f/your-form-id" method="POST">
                    <input type="text" name="name" placeholder="您的姓名 / 公司名称" required>
                    <input type="email" name="email" placeholder="您的邮箱" required>
                    <input type="text" name="subject" placeholder="询盘主题">
                    <textarea name="message" placeholder="请描述您的采购需求，如产品品类、规格、数量等" required></textarea>
                    <button type="submit">提交询盘</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">© 2025 TIGER International Trade Co Ltd · 泰伊戈尔国际贸易有限公司</div>

            }
        }
    </script>
    <script type="module" src="assets/js/bg.js"></script>
