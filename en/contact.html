<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Contact - TIGER</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <nav class="navbar">
        <div class="brand">TIGER</div>
        <div style="display:flex;align-items:center;">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="solutions.html">Solutions</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="lang-switch">
                <a href="../contact.html">中文</a>
                <a href="contact.html" class="active">EN</a>
                <a href="../ko/contact.html">한국어</a>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <h2 class="section-title">Contact Us</h2>
        <div class="contact-grid">
            <div class="contact-info">
                <h3>Get in Touch</h3>
                <div class="info-item">
                    <div class="info-label">TEL</div>
                    <div class="info-value">+86 000 0000 0000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">EMAIL</div>
                    <div class="info-value">info@tiger-trade.com</div>
                </div>
                <div class="info-item">
                    <div class="info-label">WhatsApp</div>
                    <div class="info-value">+86 000 0000 0000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">ADDRESS</div>
                    <div class="info-value">Shenzhen, Guangdong, China</div>
                </div>
            </div>

            <div class="contact-form">
                <h3>Send Inquiry</h3>
                <form action="https://formspree.io/f/your-form-id" method="POST">
                    <input type="text" name="name" placeholder="Your Name / Company" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <input type="text" name="subject" placeholder="Subject">
                    <textarea name="message" placeholder="Please describe your procurement needs, such as product category, specs, quantity, etc." required></textarea>
                    <button type="submit">Submit Inquiry</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">© 2026 TIGER International Trade Co Ltd</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="../assets/js/bg.js"></script>
</body>
</html>
