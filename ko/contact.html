    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <nav class="navbar">
        <div class="brand">TIGER</div>
        <div style="display:flex;align-items:center;">
            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="products.html">제품 센터</a></li>
                <li><a href="solutions.html">솔루션</a></li>

                <li><a href="about.html">회사 소개</a></li>
                <li><a href="contact.html" class="active">문의하기</a></li>
            </ul>
            <div class="lang-switch">
                <a href="../contact.html">中文</a>
                <a href="../en/contact.html">EN</a>
                <a href="contact.html" class="active">한국어</a>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <h2 class="section-title">문의하기</h2>
        <div class="contact-grid">
            <div class="contact-info">
                <h3>연락처</h3>
                <div class="info-item">
                    <div class="info-label">전화 / TEL</div>
                    <div class="info-value">+86 000 0000 0000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">이메일 / EMAIL</div>
                    <div class="info-value">info@tiger-trade.com</div>
                </div>
                <div class="info-item">
                    <div class="info-label">WhatsApp</div>
                    <div class="info-value">+86 000 0000 0000</div>
                </div>
                <div class="info-item">
                    <div class="info-label">주소 / ADDRESS</div>
                    <div class="info-value">중국 · 장쑤성 · 창저우시</div>
                </div>
            </div>

            <div class="contact-form">
                <h3>문의 보내기</h3>
                <form action="https://formspree.io/f/your-form-id" method="POST">
                    <input type="text" name="name" placeholder="성함 / 회사명" required>
                    <input type="email" name="email" placeholder="이메일" required>
                    <input type="text" name="subject" placeholder="문의 제목">
                    <textarea name="message" placeholder="제품 카테고리, 규격, 수량 등 조달 요구사항을 설명해 주세요." required></textarea>
                    <button type="submit">문의 제출</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">© 2026 TIGER International Trade Co Ltd</div>

            }
        }
    </script>
    <script type="module" src="../assets/js/bg.js"></script>
